<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Cool 2.0 - 工具雷达原型</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f9fafb;
      --sidebar: #f1f3f5;
      --text: #19202a;
      --text-2: #4f5968;
      --muted: #7c8592;
      --line: #dde1e6;
      --line-2: #cdd3da;
      --blue: #285ee8;
      --blue-soft: #e9efff;
      --green: #16794b;
      --green-soft: #e6f5ed;
      --amber: #9a6200;
      --amber-soft: #fff2d2;
      --red: #af3333;
      --red-soft: #fdeaea;
      --purple: #7052a5;
      --shadow: 0 14px 36px rgba(24, 32, 45, .14);
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--text); background: var(--bg); font: 14px/1.55 var(--sans); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 208px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; padding: 18px 14px;
      background: var(--sidebar); border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
    }
    .brand {
      height: 54px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
      border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface);
      font-size: 21px; font-weight: 750;
    }
    .brand-mark { color: var(--blue); }
    .brand small { margin-left: auto; color: var(--muted); font-size: 10px; font-weight: 700; }
    .nav { margin-top: 14px; flex: 1; }
    .nav-group { padding: 13px 10px 5px; color: var(--muted); font-size: 11px; }
    .nav-button {
      width: 100%; min-height: 38px; padding: 8px 10px; margin: 2px 0; border: 0;
      border-radius: 7px; background: transparent; color: var(--text-2); cursor: pointer;
      display: flex; align-items: center; gap: 10px; text-align: left;
    }
    .nav-button:hover { background: rgba(255, 255, 255, .72); }
    .nav-button.active { color: var(--blue); background: var(--blue-soft); font-weight: 650; }
    .nav-icon { width: 18px; color: var(--muted); text-align: center; }
    .nav-button.active .nav-icon { color: var(--blue); }
    .nav-badge { margin-left: auto; min-width: 22px; padding: 1px 6px; border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 11px; text-align: center; }
    .sidebar-foot { border-top: 1px solid var(--line); padding: 12px 8px 0; color: var(--muted); font-size: 11px; }
    .workspace { min-width: 0; }
    .topbar {
      height: 64px; padding: 0 28px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92);
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      position: sticky; top: 0; z-index: 10;
    }
    .top-search { width: min(460px, 48vw); position: relative; }
    .top-search input {
      width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2);
      padding: 0 38px 0 13px; color: var(--text); outline: none;
    }
    .top-search input:focus { border-color: var(--blue); background: var(--surface); }
    .search-key { position: absolute; right: 10px; top: 9px; color: var(--muted); font-size: 11px; }
    .user { display: flex; align-items: center; gap: 10px; color: var(--text-2); white-space: nowrap; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #24334a; color: #fff; font-size: 12px; }
    .content { padding: 24px 28px 48px; max-width: 1500px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .page-head h1 { margin: 0; font-size: 25px; line-height: 1.25; }
    .page-head p { margin: 5px 0 0; color: var(--muted); }
    .notice { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; padding: 10px 12px; border: 1px solid #efcf88; border-radius: 7px; background: #fff8e7; color: #694b0c; font-size: 12px; }
    .notice strong { white-space: nowrap; }
    .notice.compact { margin: 12px 0 0; }
    .head-actions { display: flex; gap: 8px; }
    .btn {
      min-height: 36px; padding: 7px 13px; border: 1px solid var(--line-2); border-radius: 7px;
      background: var(--surface); cursor: pointer; font-weight: 600;
    }
    .btn:hover { border-color: #aeb6c0; }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.danger { color: var(--red); }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px 16px; }
    .kpi-label { color: var(--muted); font-size: 12px; }
    .kpi-value { margin-top: 5px; font-size: 24px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .kpi-foot { margin-top: 4px; color: var(--text-2); font-size: 11px; }
    .toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px;
      border: 1px solid var(--line); border-radius: 8px 8px 0 0; background: var(--surface);
    }
    .segmented { display: flex; padding: 3px; gap: 2px; border-radius: 7px; background: var(--sidebar); }
    .segmented button { border: 0; border-radius: 5px; padding: 5px 10px; background: transparent; color: var(--text-2); cursor: pointer; }
    .segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(30,40,55,.12); }
    .select { height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text-2); padding: 0 28px 0 9px; }
    .toolbar-spacer { flex: 1; }
    .muted { color: var(--muted); }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; background: var(--surface); }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th { padding: 10px 12px; color: var(--muted); background: var(--surface-2); font-size: 11px; font-weight: 650; text-align: left; border-bottom: 1px solid var(--line); }
    td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #fafbfc; }
    .tool-cell { display: flex; gap: 11px; min-width: 260px; }
    .tool-logo { width: 34px; height: 34px; border-radius: 7px; flex: 0 0 auto; display: grid; place-items: center; font-weight: 800; color: #fff; background: #24334a; }
    .tool-logo.blue { background: var(--blue); }
    .tool-logo.green { background: var(--green); }
    .tool-logo.purple { background: var(--purple); }
    .tool-name { font-weight: 700; }
    .tool-desc { margin-top: 2px; color: var(--muted); font-size: 12px; max-width: 420px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { padding: 2px 7px; border-radius: 5px; background: #eef0f3; color: var(--text-2); font-size: 11px; white-space: nowrap; }
    .tag.source { color: #315a87; background: #eaf3fb; }
    .signal { display: flex; flex-direction: column; gap: 4px; min-width: 110px; }
    .signal-line { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .dot.mid { background: #c68410; }
    .status { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .status.discovered { color: #4f5968; background: #edf0f3; }
    .status.assess { color: var(--amber); background: var(--amber-soft); }
    .status.trial { color: var(--blue); background: var(--blue-soft); }
    .status.adopt { color: var(--green); background: var(--green-soft); }
    .status.caution { color: var(--red); background: var(--red-soft); }
    .status.conditional { color: var(--amber); background: var(--amber-soft); }
    .status.notadopt { color: var(--red); background: var(--red-soft); }
    .status.stale { color: #606975; background: #e8ebef; }
    .risk { display: flex; align-items: center; gap: 5px; color: var(--text-2); font-size: 12px; }
    .risk i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .risk.medium i { background: #c68410; }
    .risk.high i { background: var(--red); }
    .empty { padding: 56px; text-align: center; color: var(--muted); }
    .section { margin-top: 22px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; }
    .card-top { display: flex; gap: 11px; align-items: flex-start; }
    .card h3 { margin: 0; font-size: 15px; }
    .card p { margin: 6px 0 0; color: var(--text-2); font-size: 12px; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); margin-top: 13px; padding-top: 12px; color: var(--muted); font-size: 11px; }
    .card-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
    .card-fact { min-width: 0; }
    .card-fact span { display: block; color: var(--muted); font-size: 10px; }
    .card-fact strong { display: block; margin-top: 2px; color: var(--text-2); font-size: 11px; font-weight: 600; overflow-wrap: anywhere; }
    .link-button { padding: 0; border: 0; background: transparent; color: var(--blue); cursor: pointer; font-weight: 650; }
    .category-strip { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
    .category-strip button { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 6px 10px; cursor: pointer; }
    .category-strip button.active { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
    .kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 10px; overflow-x: auto; }
    .lane { border: 1px solid var(--line); border-radius: 8px; background: #f1f3f5; min-height: 470px; padding: 10px; }
    .lane-head { display: flex; justify-content: space-between; color: var(--text-2); font-weight: 700; padding: 2px 2px 10px; }
    .lane-count { color: var(--muted); font-weight: 500; }
    .task { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 12px; margin-bottom: 8px; }
    .task-title { font-weight: 700; }
    .task p { margin: 4px 0 10px; color: var(--muted); font-size: 11px; }
    .task-foot { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .assignee { width: 22px; height: 22px; border-radius: 50%; background: #dbe1e8; display: grid; place-items: center; color: var(--text-2); font-size: 10px; }
    .source-health { display: flex; align-items: center; gap: 7px; }
    .source-health::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .source-health.warn::before { background: #c68410; }
    .source-health.off::before { background: #a4abb4; }
    .daily-paper { max-width: 900px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 30px; }
    .daily-paper h1 { font-family: Georgia, "Songti SC", serif; font-size: 48px; }
    .daily-lead { margin-top: 20px; padding: 18px; border: 1px solid var(--line); border-radius: 8px; }
    .news-list { max-width: 980px; }
    .news { display: grid; grid-template-columns: 70px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .news-time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .news h3 { margin: 0; font-size: 16px; }
    .news p { margin: 5px 0 0; color: var(--text-2); }
    .term-cloud { min-height: 420px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 18px 24px; padding: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .term-cloud button { border: 0; background: transparent; cursor: pointer; color: var(--text-2); }
    .term-cloud button:nth-child(3n) { color: var(--blue); }
    .term-cloud button:nth-child(4n) { color: var(--green); }
    .drawer-backdrop { display: none; position: fixed; inset: 0; z-index: 30; background: rgba(20,27,37,.28); }
    .drawer-backdrop.open { display: block; }
    .drawer { position: absolute; top: 0; right: 0; width: min(660px, 92vw); min-height: 100%; background: var(--surface); box-shadow: var(--shadow); }
    .drawer-head { height: 64px; padding: 0 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .drawer-title { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 17px; }

    .drawer-body { padding: 20px; }
    .drawer-actions { display: flex; gap: 8px; margin-bottom: 18px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

      .nav-button { width: auto; flex: 0 0 auto; min-height: 34px; padding: 7px 10px; }
      .topbar { top: 0; height: 56px; padding: 0 14px; }
      .top-search { width: 100%; }
      .user span { display: none; }
      .content { padding: 18px 14px 36px; }
      .page-head { align-items: stretch; flex-direction: column; }
      .head-actions { width: 100%; }
      .head-actions .btn { flex: 1; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards { grid-template-columns: 1fr; }
      .card-facts { grid-template-columns: 1fr; }
      .kanban { grid-template-columns: repeat(4, 260px); }
      .detail-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .daily-paper { padding: 20px; }
      .daily-paper h1 { font-size: 36px; }
    }
  </style>
</head>

          btn.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('active')); btn.classList.add('active'); applyToolFilters();
        }));
        document.getElementById('sourceFilter').addEventListener('change', applyToolFilters);
        document.getElementById('useFilter').addEventListener('change', applyToolFilters);
        document.querySelectorAll('[data-tool]').forEach(row => row.addEventListener('click', () => openTool(row.dataset.tool)));
      }
      if (currentView === 'toolbox') {
        const bindToolboxReports = () => document.querySelectorAll('[data-open-report]').forEach(btn => btn.addEventListener('click', () => openReport(btn.dataset.openReport)));
        document.querySelectorAll('[data-toolbox-filter]').forEach(btn => btn.addEventListener('click', () => {
          btn.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('active')); btn.classList.add('active');
          const value = btn.dataset.toolboxFilter;
          document.getElementById('toolboxCards').innerHTML = toolboxCards(toolboxEntries.filter(x => value === 'all' || x.category === value));
          bindToolboxReports();
        }));
        bindToolboxReports();
      }
      if (currentView === 'reports') {
        const bindReportDetails = () => document.querySelectorAll('[data-report-detail]').forEach(btn => btn.addEventListener('click', () => openReport(btn.dataset.reportDetail)));
        document.querySelectorAll('[data-report-filter]').forEach(btn => btn.addEventListener('click', () => {
          btn.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('active')); btn.classList.add('active');
          const value = btn.dataset.reportFilter;
          document.getElementById('reportCards').innerHTML = reportCards(reports.filter(x => value === 'all' || (value === 'Stale' ? x.lifecycle === 'Stale' : x.decision === value)));
          bindReportDetails();
        }));
        bindReportDetails();
      }
    }

    function applyToolFilters() {
      const stage = document.querySelector('[data-filter="stage"] button.active').dataset.value;
      const source = document.getElementById('sourceFilter').value;
      const useCase = document.getElementById('useFilter').value;
      const result = tools.filter(t => (stage === 'all' || candidateStatus(t).key === stage) && (source === 'all' || t.source.includes(source)) && (useCase === 'all' || t.useCase === useCase));
      document.getElementById('toolRows').innerHTML = toolRows(result);
      document.getElementById('resultCount').textContent = result.length + ' 个候选';
      document.querySelectorAll('[data-tool]').forEach(row => row.addEventListener('click', () => openTool(row.dataset.tool)));
    }

    function openTool(id) {
      const t = tools.find(x => x.id === id); if (!t) return;
      const state = candidateStatus(t);
      document.getElementById('drawerLogo').textContent = t.initial;
      document.getElementById('drawerLogo').className = `tool-logo ${t.color}`;
      document.getElementById('drawerName').textContent = t.name;
      document.getElementById('drawerBody').innerHTML = `
        <div class="drawer-actions"><button class="btn primary" id="startEval">加入评测</button><button class="btn danger" id="rejectTool">不纳入</button><button class="btn">查看来源</button></div>
        <div class="tags"><span class="status ${state.className}">${state.text}</span>${t.source.map(x => `<span class="tag source">${x}</span>`).join('')}${t.use.map(x => `<span class="tag">${x}</span>`).join('')}</div>
        <div class="notice compact"><strong>尚未完成评测</strong><span>以下仅为发现优先级和证据缺口，不构成使用建议。</span></div>
        <p style="margin:14px 0;color:var(--text-2)">${t.desc}</p>
        <div class="detail-grid">
          <div class="detail-block"><strong>候选版本</strong><span>${t.version}</span></div>
          <div class="detail-block"><strong>UseCase / Scope</strong><span>${t.useCase} · ${t.scope}</span></div>
          <div class="detail-block"><strong>候选 / 评测状态</strong><span>${t.candidateState} · ${t.evaluationState || '未计划'}</span></div>
          <div class="detail-block"><strong>Decision / Lifecycle</strong><span>${t.decision || '尚无结论'} · ${t.lifecycle}</span></div>
          <div class="detail-block"><strong>许可证</strong><span>${t.license}</span></div>
          <div class="detail-block"><strong>最近更新</strong><span>${t.updated}</span></div>
          <div class="detail-block"><strong>评测负责人</strong><span>${t.owner}</span></div>
          <div class="detail-block"><strong>初步风险</strong><span>${t.riskText} · 安装与权限仍需验证</span></div>
        </div>
        <section class="evidence"><h3>发现依据</h3>
          <div class="evidence-row"><div class="evidence-label">来源信号</div><div class="evidence-value">${t.signal.join(' · ')}</div></div>
          <div class="evidence-row"><div class="evidence-label">适用任务</div><div class="evidence-value">${t.use.join('、')}</div></div>
          <div class="evidence-row"><div class="evidence-label">准入缺口</div><div class="evidence-value">真实案例效果、数据权限、安全边界、维护成本</div></div>
        </section>
        <section class="evidence"><h3>发现优先级</h3><div class="score-bars">
          ${['任务相关性','来源多样性','维护活跃','采用趋势','元数据完整'].map((name, i) => `<div class="score-row"><span>${name}</span><div class="bar"><i style="width:${t.score[i]}%"></i></div><strong>${t.score[i]}</strong></div>`).join('')}
        </div></section>`;
      const backdrop = document.getElementById('drawerBackdrop'); backdrop.classList.add('open'); backdrop.setAttribute('aria-hidden','false');
      document.getElementById('startEval').addEventListener('click', () => { closeDrawer(); mount('evaluations'); toast(t.name + ' 已加入待评测'); });
      document.getElementById('rejectTool').addEventListener('click', () => { closeDrawer(); toast(t.name + ' 已标记为不纳入'); });
    }

    function openReport(id) {
      const r = reports.find(x => x.id === id); if (!r) return;
      document.getElementById('drawerLogo').textContent = r.initial;
      document.getElementById('drawerLogo').className = `tool-logo ${r.color}`;
      document.getElementById('drawerName').textContent = r.name + ' · 评测报告';
      document.getElementById('drawerBody').innerHTML = `
        <div class="tags"><span class="status ${decisionClass(r.decision)}">${decisionText(r.decision)}</span>${r.lifecycle === 'Stale' ? '<span class="status stale">已过期</span>' : '<span class="tag">Current</span>'}<span class="tag">证据 ${r.evidence}</span></div>
        <p style="margin:14px 0;color:var(--text-2)">${r.desc}</p>
        <div class="detail-grid">
          <div class="detail-block"><strong>UseCase / 适用范围</strong><span>${r.category} · ${r.scope}</span></div>
          <div class="detail-block"><strong>版本 / 生命周期</strong><span>${r.version} · ${r.lifecycle}</span></div>
          <div class="detail-block"><strong>Owner / 复评</strong><span>${r.owner} · ${r.review}</span></div>
          <div class="detail-block"><strong>安全边界</strong><span>${r.security}</span></div>
        </div>
        <section class="evidence"><h3>方法与证据</h3>
          <div class="evidence-row"><div class="evidence-label">测试方法</div><div class="evidence-value">${r.method}</div></div>
          <div class="evidence-row"><div class="evidence-label">可验证事实</div><div class="evidence-value">${r.facts}</div></div>
          <div class="evidence-row"><div class="evidence-label">失败与限制</div><div class="evidence-value">${r.failure}</div></div>
          <div class="evidence-row"><div class="evidence-label">替代方案</div><div class="evidence-value">${r.alternatives}</div></div>
        </section>
        <section class="evidence"><h3>评测者观点</h3><div class="detail-block"><span>${r.viewpoint}</span></div></section>
        <div class="decision-actions"><strong style="width:100%">针对该 UseCase 记录你的决定</strong><button class="btn primary" data-user-decision="Try">试用</button><button class="btn" data-user-decision="Use">采用</button><button class="btn danger" data-user-decision="NotUse">不采用</button>${r.lifecycle === 'Stale' ? '<button class="btn" data-request-review>申请复评</button>' : ''}</div>`;
      const backdrop = document.getElementById('drawerBackdrop'); backdrop.classList.add('open'); backdrop.setAttribute('aria-hidden','false');
      document.querySelectorAll('[data-user-decision]').forEach(btn => btn.addEventListener('click', () => { toast(`已记录 ${btn.dataset.userDecision} · ${r.category}`); closeDrawer(); }));
      document.querySelector('[data-request-review]')?.addEventListener('click', () => { toast('复评申请已提交'); closeDrawer(); });
    }

    function openEvaluationRequest() {
      document.getElementById('drawerLogo').textContent = '?';
      document.getElementById('drawerLogo').className = 'tool-logo blue';
      document.getElementById('drawerName').textContent = '申请评测';
      document.getElementById('drawerBody').innerHTML = `
        <div class="notice"><strong>绑定 UseCase</strong><span>申请进入候选优先级和评测排期，不代表工具会被推荐。</span></div>
        <form id="evaluationRequestForm" class="form-grid">
          <label class="field"><span>目标任务</span><select required><option value="">请选择</option><option>页面自动化测试</option><option>AI 资讯监控</option><option>团队资讯阅读</option><option>LLM 链路观测</option><option>新建 UseCase</option></select></label>
          <label class="field"><span>目标用户</span><input required placeholder="例如：AI 产品经理"></label>
          <label class="field"><span>部署方式</span><select required><option>内网自部署</option><option>SaaS</option><option>本地客户端</option></select></label>
          <label class="field"><span>数据敏感级别</span><select required><option>公开数据</option><option>内部非敏感</option><option>内部敏感</option></select></label>
          <label class="field full"><span>成功标准</span><textarea required placeholder="描述任务、基线、期望结果和不可接受风险"></textarea></label>
          <div class="drawer-actions field full"><button class="btn" type="button" id="cancelRequest">取消</button><button class="btn primary" type="submit">提交申请</button></div>
        </form>`;
      const backdrop = document.getElementById('drawerBackdrop'); backdrop.classList.add('open'); backdrop.setAttribute('aria-hidden','false');
      document.getElementById('cancelRequest').addEventListener('click', closeDrawer);
      document.getElementById('evaluationRequestForm').addEventListener('submit', e => { e.preventDefault(); closeDrawer(); toast('评测申请已提交并绑定 UseCase'); });
    }

    function closeDrawer() { const el = document.getElementById('drawerBackdrop'); el.classList.remove('open'); el.setAttribute('aria-hidden','true'); }
    document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
    document.getElementById('drawerBackdrop').addEventListener('click', e => { if (e.target.id === 'drawerBackdrop') closeDrawer(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
    document.querySelectorAll('.nav-button').forEach(btn => btn.addEventListener('click', () => mount(btn.dataset.view)));
    document.getElementById('globalSearch').addEventListener('keydown', e => { if (e.key === 'Enter') { mount('radar'); toast('已搜索：' + e.target.value); } });

    const initial = location.hash.slice(1);
    mount(renderers[initial] ? initial : 'radar');
  </script>
</body>
</html>
