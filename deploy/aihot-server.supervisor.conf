; aihot API + SSR 详情页服务器。Melos 用 supervisor(PID 1)做进程管理,不是 systemd。
; autorestart 崩溃自拉起,supervisor 随机器起 → 重启持久化。
[program:aihot-server]
command=/root/aihot/bin/aihot-server.sh
directory=/root/aihot
environment=AIHOT_DATABASE_URL="postgres://aihot:aihot@localhost:5432/aihot"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/root/aihot/log/server.log
stderr_logfile=/root/aihot/log/server.log
